<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Place an Order - Pilgrim Pantry</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div class="brand">Pilgrim Pantry</div>
        <nav>
          <a href="{{ url_for('home') }}">Home</a>
          <a href="{{ url_for('order_products') }}">Order Now</a>
        </nav>
      </div>
    </header>

    <main class="container form-wrap">
      <h1>Place your order</h1>
      <form method="POST" action="{{ url_for('order_products') }}" class="order-form">
        <div class="customer-details">
          <label>
            Full name
            <input type="text" name="customer_name" required />
          </label>
          <label>
            Email
            <input type="email" name="email" required />
          </label>
          <label>
            Delivery address
            <textarea name="address" rows="3" required></textarea>
          </label>
        </div>

        <div class="menu-list">
          {% for product in products %}
          <div class="menu-item">
            <div>
              <h3>{{ product.name }}</h3>
              <p>{{ product.description }}</p>
              <strong>${{ '%.2f' % product.price }}</strong>
            </div>
            <label class="qty-box">
              Quantity
              <input type="number" name="qty_{{ product.id }}" min="0" max="{{ product.stock }}" value="0" />
            </label>
          </div>
          {% endfor %}
        </div>

        <button type="submit" class="primary-btn">Place order</button>
      </form>
    </main>
  </body>
</html>

name: Flask CI

on:
  push:
    branches: [main, release-*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile application
        run: python -m compileall -q app.py

      - name: Smoke test Flask routes
        run: |
          python - <<'PY'
          from app import app

          client = app.test_client()
          assert client.get("/").status_code == 200
          health = client.get("/health")
          assert health.status_code == 200, health.get_json()
          assert health.get_json()["database"] == "connected"
          PY

  deploy:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-')
    needs: test
    runs-on: [self-hosted, linux, x64]
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Deploy Flask release to EC2
        run: bash .github/workflows/deploy.sh
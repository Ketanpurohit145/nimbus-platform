name: Flask CI
# Runs tests on every push/PR, then deploys automatically when a release-* branch build passes.

permissions:
  contents: read

concurrency:
  group: pilgrim-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main, release-*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile application
        run: python -m compileall -q app.py

      - name: Smoke test Flask routes
        run: |
          python - <<'PY'
          from app import app

          client = app.test_client()
          assert client.get("/").status_code == 200
          health = client.get("/health")
          assert health.status_code == 200, health.get_json()
          assert health.get_json()["database"] == "connected"
          PY

  deploy:
    # Only release-* branch pushes deploy; PRs and main only run the test job above.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-')
    needs: test
    runs-on: [self-hosted, linux, x64]  # runs on the app EC2 instance itself, avoiding SSH credentials in CI
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Deploy Flask release to EC2
        run: bash .github/workflows/deploy.sh